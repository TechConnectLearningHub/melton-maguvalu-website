<section
  aria-labelledby="contact-title"
  class="section contact-section"
  id="contact"
>
  <div class="contact-layout">
    <div>
      <span class="section-kicker">Take action</span>
      <h2 id="contact-title">What would you like to do next?</h2>
      <p>
        Use one form for now, but route every enquiry by intent: membership,
        volunteering, business listing, event sponsorship or long-term
        partnership.
      </p>
      <div class="action-list">
        <a data-interest="Join the community" href="#contact">Join Community</a>
        <a data-interest="Volunteer" href="#contact">Volunteer</a>
        <a data-interest="List my business" href="#contact">List Business</a>
        <a href="./resources/pages/sponsorship.html">Become Partner</a>
      </div>
    </div>
    <form class="contact-form">
      <label
        >Name<input name="name" placeholder="Your name" required="" type="text"
      /></label>
      <label
        >Email<input
          name="email"
          placeholder="Email address"
          required=""
          type="email"
      /></label>
      <label
        >Interest<select name="interest" required="">
          <option value="">Select one...</option>
          <option>Join the community</option>
          <option>Volunteer</option>
          <option>List my business</option>
          <option>Event sponsorship</option>
          <option>Long-term partnership</option>
          <option>Media / council / grants</option>
        </select></label
      >
      <label
        >Message<textarea
          name="message"
          placeholder="Tell us what you are looking for"
        ></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Send Enquiry</button>
      <p aria-live="polite" class="form-feedback" role="status"></p>
    </form>
  </div>
</section>
